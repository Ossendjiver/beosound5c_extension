name: Publish BS5c Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - '.github/workflows/release-bs5c.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run Python tests
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r tests/requirements.txt
          pytest -q tests/unit/python

      - name: Publish or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          NOTES="Context-aware local library and recommendation service; Home Assistant weather/Garmin context; non-waking BS5c prompts; post-run yoga routing and UI integration."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "BeoSound 5c $TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "BeoSound 5c $TAG" --notes "$NOTES"
          fi
