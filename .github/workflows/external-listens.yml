name: External listening receiver
on:
  pull_request:
  push:
    branches: [dev/external-listening-history]
jobs:
  receiver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile services/external_listens.py
      - run: python -m unittest discover -s tests -p test_external_listens.py -v
      - run: python -m unittest discover -s tests -p test_presence_limit.py -v
