name: BS5c external listening unit tests
on:
  pull_request:
  push:
    branches: [feature/external-listens]
jobs:
  external-listens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'aiohttp>=3.9,<4'
      - run: python -m unittest discover -s services/tests -p 'test_external_listens.py' -v
      - run: python -m compileall -q services/lib/external_listens.py services/library.py
