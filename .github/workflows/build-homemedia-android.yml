name: Build HomeMedia Android APK

on:
  push:
    branches:
      - homemedia-android-build
    paths:
      - 'homemedia-android/**'
      - '.github/workflows/build-homemedia-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homemedia-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: homemedia-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          echo "Using sdkmanager: $SDKMANAGER"
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.2" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Test and build APKs
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Stage APK signing tool
        shell: bash
        run: |
          mkdir -p build-tools
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" build-tools/apksigner.jar

      - name: Sign release APK with persistent key
        shell: bash
        env:
          HOME_MEDIA_KEYSTORE_B64: ${{ secrets.HOME_MEDIA_KEYSTORE_B64 }}
          HOME_MEDIA_KEYSTORE_PASSWORD: ${{ secrets.HOME_MEDIA_KEYSTORE_PASSWORD }}
          HOME_MEDIA_KEY_ALIAS: ${{ secrets.HOME_MEDIA_KEY_ALIAS }}
          HOME_MEDIA_KEY_PASSWORD: ${{ secrets.HOME_MEDIA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${HOME_MEDIA_KEYSTORE_B64:-}" ]; then
            echo "Persistent signing secrets are not configured; leaving release APK unsigned."
            exit 0
          fi
          printf '%s' "$HOME_MEDIA_KEYSTORE_B64" | base64 --decode > build-tools/home-media-release.keystore
          java -jar build-tools/apksigner.jar sign \
            --ks build-tools/home-media-release.keystore \
            --ks-pass env:HOME_MEDIA_KEYSTORE_PASSWORD \
            --ks-key-alias "$HOME_MEDIA_KEY_ALIAS" \
            --key-pass env:HOME_MEDIA_KEY_PASSWORD \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          java -jar build-tools/apksigner.jar verify --verbose --print-certs \
            app/build/outputs/apk/release/app-release-signed.apk

      - name: Upload APKs and signing tool
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HomeMedia-v0.5.4-build
          path: |
            homemedia-android/app/build/outputs/apk/debug/app-debug.apk
            homemedia-android/app/build/outputs/apk/release/app-release-unsigned.apk
            homemedia-android/app/build/outputs/apk/release/app-release-signed.apk
            homemedia-android/build-tools/apksigner.jar
          if-no-files-found: error
          retention-days: 14
